# .github/workflows/pipeline_ipc_mensual.yml
#
# Workflow: extracción automática de IPC mensual (DANE)
# Frecuencia: día 5 de cada mes a las 10:00 AM hora Colombia
#   → El DANE publica el IPC del mes anterior entre los días 4 y 7 de cada mes.
#

name: Pipeline IPC mensual

on:
  schedule:
    # Día 5 de cada mes a las 15:00 UTC (10:00 AM Colombia, UTC-5)
    - cron: "0 15 5 * *"

  workflow_dispatch:
    inputs:
      anio:
        description: "Año a descargar completo (ej: 2023). Vacío = reciente."
        required: false
        default: ""

jobs:
  extraer_ipc:
    name: Extraer y guardar IPC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests pandas

      - name: Crear carpeta data/
        run: mkdir -p data

      - name: Extraer IPC
        run: |
          if [ -n "${{ github.event.inputs.anio }}" ]; then
            python scripts/extraer_ipc.py --anio "${{ github.event.inputs.anio }}"
          else
            python scripts/extraer_ipc.py
          fi

      - name: Verificar archivos generados
        run: |
          echo "=== Archivos en data/ ==="
          ls -lh data/
          echo ""
          echo "=== Últimas filas IPC en maestro ==="
          grep "ipc" data/macro_colombia.csv | tail -5 || echo "(sin datos IPC aún)"

      - name: Guardar datos en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro_colombia.csv data/pipeline_log.csv || true
          git diff --staged --quiet || git commit -m "auto: IPC actualizado $(date -u '+%Y-%m')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar fallo
        if: failure()
        run: echo "El pipeline de IPC falló el $(date -u). Revisar GitHub Actions."
