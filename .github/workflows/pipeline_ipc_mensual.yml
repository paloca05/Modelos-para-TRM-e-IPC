name: Pipeline IPC mensual

on:
  schedule:
    - cron: "0 15 5 * *"
  workflow_dispatch:
    inputs:
      anio:
        description: "Año (ignorado, la API trae todo el historico)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extraer_ipc:
    name: Extraer y guardar IPC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Crear carpeta data/
        run: mkdir -p data

      - name: Extraer IPC
        run: python scripts/extraer_ipc.py

      - name: Verificar archivos generados
        run: |
          ls -lh data/ || echo "(carpeta vacia)"
          tail -5 data/macro_colombia.csv 2>/dev/null || echo "(archivo aun no existe)"

      - name: Guardar datos en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "auto: IPC actualizado $(date -u '+%Y-%m')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
