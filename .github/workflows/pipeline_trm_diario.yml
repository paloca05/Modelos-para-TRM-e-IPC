# .github/workflows/pipeline_trm_diario.yml
#
# Workflow: extracción automática de TRM
# Frecuencia: lunes a viernes a las 8:00 AM hora Colombia (UTC-5 = 13:00 UTC)
# También se puede ejecutar manualmente desde la pestaña "Actions" en GitHub.
#
# PREREQUISITOS:
#   1. Tener este repositorio en GitHub (público o privado).
#   2. El workflow tiene permisos para hacer commit de los archivos CSV actualizados.
#      Ir a: Settings > Actions > General > Workflow permissions > "Read and write"
#

name: Pipeline TRM diario

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha específica (YYYY-MM-DD). Vacío = ayer."
        required: false
        default: ""
      rango_inicio:
        description: "Inicio rango histórico (YYYY-MM-DD)"
        required: false
        default: ""
      rango_fin:
        description: "Fin rango histórico (YYYY-MM-DD)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extraer_trm:
    name: Extraer y guardar TRM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Crear carpeta data/
        run: mkdir -p data

      - name: Extraer TRM
        run: |
          if [ -n "${{ github.event.inputs.rango_inicio }}" ]; then
            python scripts/extraer_trm.py --rango "${{ github.event.inputs.rango_inicio }}" "${{ github.event.inputs.rango_fin }}"
          elif [ -n "${{ github.event.inputs.fecha }}" ]; then
            python scripts/extraer_trm.py --fecha "${{ github.event.inputs.fecha }}"
          else
            python scripts/extraer_trm.py
          fi

      - name: Verificar archivos generados
        run: |
          ls -lh data/ || echo "(carpeta vacía)"
          tail -5 data/macro_colombia.csv 2>/dev/null || echo "(archivo aún no existe)"

      - name: Guardar datos en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "auto: TRM actualizada $(date -u '+%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
